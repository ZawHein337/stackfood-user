  country_code_picker: ^3.4.1
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  sign_in_with_apple: ^8.1.0
  flutter_facebook_auth: ^7.1.2
  photo_view: ^0.15.0
  dotted_border: ^3.1.0
  share_plus: ^12.0.1
  custom_map_markers: ^0.0.2+1
  card_swiper: ^3.0.1
  expandable_bottom_sheet: ^1.1.1+1
  intl: ^0.20.3
  flutter_slidable: ^4.0.3
  just_the_tooltip: ^0.0.12
  qr_flutter: ^4.1.0
  animated_flip_counter: ^0.3.4
  marquee: ^2.3.0
  syncfusion_flutter_datepicker: ^34.1.32
#  firebase_crashlytics: ^4.0.4
  file_picker: ^10.3.8
  path: ^1.9.1
  http_parser: ^4.1.2
  flutter_svg: ^2.3.0
  custom_info_window: ^1.0.1
  flutter_widget_from_html_core: ^0.17.2
  smooth_page_indicator: ^2.0.1
  video_player: ^2.13.0
  chewie: ^1.13.1
  flutter_cache_manager: ^3.4.2
  web: ^1.1.1
  location: ^10.0.1
  permission_handler: ^12.0.3
  firebase_auth: ^6.1.2
  get_thumbnail_video: ^0.7.3
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  speech_to_text: ^7.4.0
  lottie: ^3.5.1
  dropdown_button2: ^3.1.0
  emoji_picker_flutter: ^4.5.2
  loading_animation_widget: ^1.3.0
  scroll_datetime_picker: ^0.2.2
  full_screen_bottom_sheet: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/map/
    - assets/json/

  fonts:
  - family: NotoSansMyanmar
    fonts:
      - asset: assets/font/NotoSansMyanmar-Regular.ttf
        weight: 400
      - asset: assets/font/NotoSansMyanmar-Medium.ttf
        weight: 500
      - asset: assets/font/NotoSansMyanmar-SemiBold.ttf
        weight: 600
      - asset: assets/font/NotoSansMyanmar-Bold.ttf
        weight: 700