  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  path_provider: ^2.1.6
  pin_code_fields: ^9.4.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.1
  google_maps_flutter_web: ^0.6.3
  carousel_slider: ^5.1.2
  shimmer_animation: ^2.2.2+1
  image_picker: ^1.2.3
  universal_html: ^2.3.0
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  http: ^1.6.0
  pointer_interceptor: ^0.10.1+2
